name: Production retention maintenance
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only plan, or deliberately consolidate inactive sessions
        type: choice
        default: plan
        options: [plan, maintain]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: world-pulse-production-retention
  cancel-in-progress: false
jobs:
  retention:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.WP_RETENTION_ENABLED == 'true')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix infra --ignore-scripts
      - run: npm test --prefix infra
      - name: Bounded maintenance with runtime only, no HTTP endpoint
        run: node infra/retention-maintenance.mjs
        env:
          WP_RETENTION_OPERATION: ${{ inputs.operation || 'maintain' }}
          WP_RETENTION_ENABLED: ${{ vars.WP_RETENTION_ENABLED }}
          WP_PRODUCTION_DB_HOST: ${{ vars.WP_PRODUCTION_DB_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
