name: Visual POC CI

on:
  push:
    branches:
      - feat/globe-poc
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/visual-poc-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5fc5df5f5a6a2c19e2b271b9bd94
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
