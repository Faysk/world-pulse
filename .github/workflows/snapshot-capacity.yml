name: Isolated snapshot capacity
on:
  pull_request:
    paths: ['scripts/capacity-*', 'scripts/snapshot-capacity.mjs', '.github/workflows/snapshot-capacity.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Cold burst diagnostics or real five-second cadence over one minute per scenario
        type: choice
        options: [burst, cadence]
        default: burst
permissions:
  contents: read
concurrency:
  group: snapshot-capacity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [map, map-ranking]
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: world_pulse_capacity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d world_pulse_capacity"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/capacity-model.test.mjs
      - name: Read-only API workload against synthetic loopback database only
        run: node scripts/snapshot-capacity.mjs
        env:
          WP_CAPACITY_BENCHMARK: '1'
          WP_CAPACITY_PROFILE: ${{ matrix.profile }}
          WP_CAPACITY_MODE: ${{ inputs.mode || 'burst' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capacity-${{ matrix.profile }}-${{ inputs.mode || 'burst' }}
          path: test-artifacts/capacity-*.json
          retention-days: 7
