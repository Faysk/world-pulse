name: Participation API CI

on:
  pull_request:
    paths:
      - "api/**"
      - "server/**"
      - "infra/sql/**"
      - "tests/api.test.mjs"
      - "tests/integration.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/participation-api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "server/**"
      - "infra/sql/**"
      - "tests/api.test.mjs"
      - "tests/integration.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/participation-api-ci.yml"

permissions:
  contents: read

jobs:
  integration:
    name: Real PostgreSQL transaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: world_pulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_pulse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install exact app dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate contract and input boundaries
        run: node --test tests/api.test.mjs
      - name: Validate idempotency and session isolation in disposable PostgreSQL
        env:
          NODE_ENV: test
          RUN_DB_INTEGRATION: "1"
        run: node --test tests/integration.test.mjs
