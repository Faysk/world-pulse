name: Coarse Geo Privacy CI

on:
  pull_request:
    paths:
      - "server/geoPrivacy.mjs"
      - "tests/geoPrivacy.test.mjs"
      - ".github/workflows/geo-privacy-ci.yml"
  push:
    branches:
      - main
    paths:
      - "server/geoPrivacy.mjs"
      - "tests/geoPrivacy.test.mjs"
      - ".github/workflows/geo-privacy-ci.yml"

permissions:
  contents: read

jobs:
  privacy-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Privacy suppression and untrusted-header tests
        run: node --test tests/geoPrivacy.test.mjs
      - name: Validate JavaScript syntax
        run: node --check server/geoPrivacy.mjs
