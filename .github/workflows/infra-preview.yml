name: Staging preview configuration
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or deliberately sync staging runtime to its branch-specific preview
        type: choice
        default: plan
        options: [plan, sync]
permissions:
  contents: read
concurrency:
  group: world-pulse-staging-preview
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/codex/remote-staging'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix infra --ignore-scripts
      - run: npm test --prefix infra
      - name: Read-only staging schema and role check
        run: node infra/staging-db.mjs
        env:
          WP_STAGING_OPERATION: check
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Plan branch-specific variables without provider access
        if: inputs.operation == 'plan'
        run: node infra/preview-sync.mjs
        env:
          WP_PREVIEW_OPERATION: plan
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Sync only when deliberately enabled; never deploy
        if: inputs.operation == 'sync'
        run: node infra/preview-sync.mjs
        env:
          WP_PREVIEW_OPERATION: sync
          WP_PREVIEW_SYNC_ENABLED: ${{ vars.WP_PREVIEW_SYNC_ENABLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
