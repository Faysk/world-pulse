name: Infrastructure CI
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra-*.yml', '.env.example']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra-*.yml', '.env.example']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --prefix infra --ignore-scripts
      - run: npm test --prefix infra
      - run: npm audit --prefix infra --omit=dev --audit-level=high
      - name: Pull official PostgreSQL client and disposable restore server
        run: docker pull postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
      - name: Exercise non-empty encrypted SQL backup and restore without cloud secrets
        run: node infra/backup-fixture.mjs
