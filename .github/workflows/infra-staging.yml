name: Staging database
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check runtime access, or deliberately apply reviewed staging migrations
        type: choice
        default: check
        options: [check, migrate, maintain, preview-plan, smoke]
  push:
    branches: [codex/remote-staging]
    paths: ['infra/staging-db*', '.github/workflows/infra-staging.yml']
permissions:
  contents: read
concurrency:
  group: world-pulse-staging-database
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/remote-staging'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --prefix infra --ignore-scripts
      - run: npm test --prefix infra
      - name: Verify TLS, schema and restricted runtime access
        if: inputs.operation != 'migrate' && inputs.operation != 'maintain'
        run: node infra/staging-db.mjs
        env:
          WP_STAGING_OPERATION: check
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply reviewed migrations only to the pinned temporary staging branch
        if: inputs.operation == 'migrate'
        run: node infra/staging-db.mjs
        env:
          WP_STAGING_OPERATION: migrate
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      # The owner is present only in an explicit migration step, never in runtime checks.
      - name: Consolidate expired inactive sessions only on the pinned staging branch
        if: inputs.operation == 'maintain'
        run: node infra/staging-db.mjs
        env:
          WP_STAGING_OPERATION: maintain
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Plan preview configuration without accessing Vercel or publishing
        if: inputs.operation == 'preview-plan'
        run: node infra/preview-sync.mjs
        env:
          WP_PREVIEW_OPERATION: plan
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Install locked app and browser only for explicit HTTPS smoke
        if: inputs.operation == 'smoke'
        run: |
          npm ci --no-fund
          npx playwright install chromium --with-deps
      - name: Create ephemeral loopback TLS certificate, never a public credential
        if: inputs.operation == 'smoke'
        run: |
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/wp-smoke.key" -out "$RUNNER_TEMP/wp-smoke.crt" -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Two browsers over private HTTPS to the pinned real staging pooler
        if: inputs.operation == 'smoke'
        run: npx playwright test --config playwright.staging.config.ts
        env:
          WP_STAGING_SMOKE: '1'
          WP_SMOKE_TLS_KEY: ${{ runner.temp }}/wp-smoke.key
          WP_SMOKE_TLS_CERT: ${{ runner.temp }}/wp-smoke.crt
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.operation == 'smoke'
        with:
          name: staging-https-smoke-ui
          path: test-artifacts/staging-smoke-*.png
          retention-days: 7
