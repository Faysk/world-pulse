name: Staging database
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check runtime access, or deliberately apply reviewed staging migrations
        type: choice
        default: check
        options: [check, migrate, maintain]
  push:
    branches: [codex/remote-staging]
    paths: ['infra/staging-db*', '.github/workflows/infra-staging.yml']
permissions:
  contents: read
concurrency:
  group: world-pulse-staging-database
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/remote-staging'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --prefix infra --ignore-scripts
      - run: npm test --prefix infra
      - name: Verify TLS, schema and restricted runtime access
        if: inputs.operation != 'migrate' && inputs.operation != 'maintain'
        run: node infra/staging-db.mjs
        env:
          WP_STAGING_OPERATION: check
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply reviewed migrations only to the pinned temporary staging branch
        if: inputs.operation == 'migrate'
        run: node infra/staging-db.mjs
        env:
          WP_STAGING_OPERATION: migrate
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      # The owner is present only in an explicit migration step, never in runtime checks.
      - name: Consolidate expired inactive sessions only on the pinned staging branch
        if: inputs.operation == 'maintain'
        run: node infra/staging-db.mjs
        env:
          WP_STAGING_OPERATION: maintain
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
